# RecipeMixer behind Caddy, with HTTPS and a password. Start it from the repository root:
#
#   mkdir -p deploy/secrets
#   node -e "console.log(require('node:crypto').randomBytes(18).toString('base64url'))" > deploy/secrets/recipemixer_password
#   SITE_ADDRESS=recipes.example.com docker compose -f deploy/docker-compose.caddy.yml up -d --build
#
# See docs/DEPLOYMENT.md for what to check before putting this on the internet.

services:
  app:
    build: ..
    image: recipemixer:local
    # Not published to the host: the only way in is through Caddy.
    expose:
      - "3210"
    environment:
      LOG_LEVEL: info
      # The password comes from a file (a Docker secret), so it does not show up in `docker inspect`.
      APP_PASSWORD_FILE: /run/secrets/recipemixer_password
      # Believe X-Forwarded-* only from a private address. That is safe here because the app is not published
      # to the host: Caddy is the only thing on the private network that can reach it. If you ever publish the
      # app's port, or put other containers on this network, replace this with Caddy's exact address.
      TRUST_PROXY: uniquelocal
      COOKIE_SECURE: "true"
    secrets:
      - recipemixer_password
    volumes:
      - recipemixer-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - web
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app
    networks:
      - web
    restart: unless-stopped

networks:
  web:

secrets:
  recipemixer_password:
    file: ./secrets/recipemixer_password

volumes:
  recipemixer-data:
  caddy-data:
  caddy-config:
